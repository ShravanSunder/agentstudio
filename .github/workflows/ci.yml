name: CI / Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every base, not only main: a stacked PR targets the branch below it and
  # still has to pass the same gates before the stack merges.
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The first-attempt gate reads a pull request's live labels.
  issues: read
  pull-requests: write

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04
    container: swift@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    defaults:
      run:
        shell: bash
    env:
      SWIFT_BUILD_DIR: .build-ci
      CI_CONTAINER_TOOLS: "1"

    steps:
      # First step of every job, before checkout: a re-run attempt fails here unless
      # its pull request carries the ci-rerun-approved label right now. A red run is
      # diagnosed, not re-run. Labels are read live because a re-run replays the
      # original event payload. Defined once here; every other job starts with its alias.
      - &first-attempt-gate
        name: First-attempt gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          override_label=ci-rerun-approved
          if [ "$RUN_ATTEMPT" -le 1 ]; then
            echo "first-attempt gate: attempt $RUN_ATTEMPT, nothing to check"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${PULL_REQUEST_NUMBER:-}" ]; then
            echo "::error::Re-run attempt $RUN_ATTEMPT of a $EVENT_NAME run is refused: only a pull request carrying the '$override_label' label may be re-run. Diagnose the red run and start a new one instead."
            exit 1
          fi
          if [ "${CI_CONTAINER_TOOLS:-}" = "1" ] && ! command -v gh >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          fi
          if ! labels="$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels" --jq '.[].name' 2>&1)"; then
            echo "::error::Re-run attempt $RUN_ATTEMPT refused: the labels of PR #$PULL_REQUEST_NUMBER could not be read, and the gate fails closed. $labels"
            exit 1
          fi
          if grep -Fxq -- "$override_label" <<<"$labels"; then
            echo "first-attempt gate: re-run attempt $RUN_ATTEMPT allowed by the '$override_label' label on PR #$PULL_REQUEST_NUMBER"
            exit 0
          fi
          echo "::error::Re-run attempt $RUN_ATTEMPT refused: a red run is diagnosed, not re-run. Add the '$override_label' label to PR #$PULL_REQUEST_NUMBER to allow this re-run."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the debt ledger ratchet can compute the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux CI prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gh jq perl curl lsof
          perl -MJSON::PP -MTime::HiRes -e 1

      - name: Trust checkout for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install lint tools
        run: bash scripts/install-ci-lint-tools.sh

      - name: Verify lint tools on PATH
        run: |
          swift-format --version
          swiftlint version

      - name: Restore architecture lint build cache
        id: architecture-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build-ci/architecture-lint
          key: architecture-lint-linux-${{ runner.arch }}-swift-6.3.3-image-8de8ea332a61-${{ hashFiles('Tools/AgentStudioArchitectureLint/Package.swift', 'Tools/AgentStudioArchitectureLint/Package.resolved') }}
          restore-keys: |
            architecture-lint-linux-${{ runner.arch }}-swift-6.3.3-image-8de8ea332a61-

      - name: AgentStudio architecture lint tool tests
        run: mise run test:architecture

      - name: Save architecture lint build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.architecture-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-ci/architecture-lint
          key: ${{ steps.architecture-cache-restore.outputs.cache-primary-key }}

      - name: Lint
        run: mise run lint:portable

      - name: Debt ledger ratchet
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: /bin/bash Tools/AgentStudioArchitectureLint/check-ledger-ratchet.sh "origin/${BASE_REF}"

  marketing-site-validation:
    name: Marketing site validation
    runs-on: ubuntu-24.04

    steps:
      - *first-attempt-gate

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for marketing site
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Google Chrome
        run: |
          npx --yes playwright@1.61.0 install --with-deps chrome
          chrome_binary="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$chrome_binary"
          echo "CHROME_BIN=$chrome_binary" >> "$GITHUB_ENV"

      - name: Install marketing site dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run marketing site checks
        run: pnpm --dir web run check

      - name: Build marketing site and Cloudflare package
        run: |
          pnpm --dir web run build
          pnpm --dir web exec cf build
          pnpm --dir web run verify:cloudflare-discovery

  bridge-web:
    name: BridgeWeb
    runs-on: macos-26
    env:
      SWIFT_BUILD_DIR: .build-ci

    steps:
      - *first-attempt-gate

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        id: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          cache_save: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for BridgeWeb
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: BridgeWeb/pnpm-lock.yaml

      - name: Get submodule SHAs
        id: submodules
        run: |
          GHOSTTY_SHA=$(git -C vendor/ghostty rev-parse HEAD)
          ZMX_SHA=$(git -C vendor/zmx rev-parse HEAD)
          echo "ghostty_sha=$GHOSTTY_SHA" >> "$GITHUB_OUTPUT"
          echo "zmx_sha=$ZMX_SHA" >> "$GITHUB_OUTPUT"

      - parallel:
          - name: Install BridgeWeb dependencies
            run: pnpm --dir BridgeWeb install --frozen-lockfile

          - name: Cache Zig compilation
            id: cache-zig-compilation
            uses: actions/cache/restore@v4
            with:
              path: |
                ~/.cache/zig
                vendor/ghostty/.zig-cache
                vendor/zmx/.zig-cache
              key: zig-compile-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}-${{ steps.submodules.outputs.zmx_sha }}
              restore-keys: |
                zig-compile-${{ runner.os }}-

          - name: Cache Ghostty artifacts
            id: cache-ghostty
            uses: actions/cache/restore@v4
            with:
              path: |
                vendor/ghostty/macos/GhosttyKit.xcframework
                vendor/ghostty/zig-out/share
              key: ghostty-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}

          - name: Cache zmx artifacts
            id: cache-zmx
            uses: actions/cache/restore@v4
            with:
              path: vendor/zmx/zig-out
              key: zmx-${{ runner.os }}-${{ steps.submodules.outputs.zmx_sha }}

      - name: Verify BridgeWeb fixtures
        run: bash scripts/bridge-web-sync-fixtures.sh

      - name: Run BridgeWeb lanes
        run: |
          # Keep CPU-heavy test lanes sequential on this runner.
          pnpm --dir BridgeWeb run check
          pnpm --dir BridgeWeb run test:unit
          pnpm --dir BridgeWeb run test:browser:integration

      - parallel:
          - name: BridgeWeb packaged build
            run: pnpm --dir BridgeWeb run build

          - name: Build Ghostty XCFramework
            if: steps.cache-ghostty.outputs.cache-hit != 'true'
            run: |
              cd vendor/ghostty
              zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native

          - name: Build zmx
            if: steps.cache-zmx.outputs.cache-hit != 'true'
            run: mise run --skip-deps build-zmx

      - name: Verify packaged BridgeWeb build
        run: test -f Sources/AgentStudio/Resources/BridgeWeb/app/index.html

      - parallel:
          - name: Copy XCFramework
            run: mise run --skip-deps copy-xcframework

          - name: Setup dev resources
            run: |
              SHELL_SRC="vendor/ghostty/zig-out/share/ghostty/shell-integration"
              SHELL_DST="Sources/AgentStudio/Resources/ghostty/shell-integration"
              if [ ! -d "$SHELL_DST" ]; then
                mkdir -p "$(dirname "$SHELL_DST")"
                cp -R "$SHELL_SRC" "$SHELL_DST"
              fi
              TERMINFO_SRC="vendor/ghostty/zig-out/share/terminfo"
              TERMINFO_DST="Sources/AgentStudio/Resources/terminfo"
              if [ ! -d "$TERMINFO_DST/78" ]; then
                mkdir -p "$TERMINFO_DST/78" "$TERMINFO_DST/67"
                [ -f "$TERMINFO_SRC/78/xterm-ghostty" ] && cp "$TERMINFO_SRC/78/xterm-ghostty" "$TERMINFO_DST/78/"
                [ -f "$TERMINFO_SRC/67/ghostty" ] && cp "$TERMINFO_SRC/67/ghostty" "$TERMINFO_DST/67/"
              fi

      - name: Build BridgeWeb Swift development backend
        run: pnpm --dir BridgeWeb run build:swift-dev-server

      - name: Test BridgeWeb Swift integration
        run: pnpm --dir BridgeWeb run test:integration:node:prepared

      # The 1,699-item backpressure journey asserts responsiveness (long-task count,
      # annotation ages under a lease) and runs in the post-merge benchmarks workflow, not here.
      - name: Test BridgeWeb Swift E2E
        run: pnpm --dir BridgeWeb run test:e2e:prepared:ordinary

  swift-test-suite:
    name: Swift test suite
    runs-on: macos-26
    env:
      SWIFT_BUILD_DIR: .build-ci
      XCB_EXTRA_ARGS: "--renderer github-actions"
      LANE_EVENT_STREAM_RETAIN_ALWAYS: "1"
      SWIFT_BUILD_STATS_DIR: ${{ github.workspace }}/tmp/plan-workflows/ci-runs/compiler-stats

    steps:
      - *first-attempt-gate

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        id: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Install lint tools for Swift test contracts
        run: bash scripts/install-ci-lint-tools.sh

      - name: Verify lint tools on PATH
        run: |
          test "$(command -v swiftlint)" = "$(mise where swiftlint@0.65.1)/swiftlint"
          swift-format --version
          swiftlint version

      # --- Submodule SHAs for cache keys ---

      - name: Get submodule SHAs
        id: submodules
        run: |
          GHOSTTY_SHA=$(git -C vendor/ghostty rev-parse HEAD)
          ZMX_SHA=$(git -C vendor/zmx rev-parse HEAD)
          echo "ghostty_sha=$GHOSTTY_SHA" >> "$GITHUB_OUTPUT"
          echo "zmx_sha=$ZMX_SHA" >> "$GITHUB_OUTPUT"

      # --- Independent BridgeWeb install and vendor cache restores ---

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for BridgeWeb
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: BridgeWeb/pnpm-lock.yaml

      - parallel:
          - name: Install BridgeWeb dependencies
            id: bridge-web-install
            run: pnpm --dir BridgeWeb install --frozen-lockfile

          - name: Cache Zig compilation
            id: cache-zig-compilation
            uses: actions/cache@v4
            with:
              path: |
                ~/.cache/zig
                vendor/ghostty/.zig-cache
                vendor/zmx/.zig-cache
              key: zig-compile-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}-${{ steps.submodules.outputs.zmx_sha }}
              restore-keys: |
                zig-compile-${{ runner.os }}-

          - name: Cache Ghostty artifacts
            id: cache-ghostty
            uses: actions/cache@v4
            with:
              path: |
                vendor/ghostty/macos/GhosttyKit.xcframework
                vendor/ghostty/zig-out/share
              key: ghostty-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}

          - name: Cache zmx artifacts
            id: cache-zmx
            uses: actions/cache@v4
            with:
              path: vendor/zmx/zig-out
              key: zmx-${{ runner.os }}-${{ steps.submodules.outputs.zmx_sha }}

      # --- Build independent BridgeWeb and vendor artifacts ---

      - parallel:
          - name: BridgeWeb packaged build
            run: pnpm --dir BridgeWeb run build

          - name: Build Ghostty XCFramework
            if: steps.cache-ghostty.outputs.cache-hit != 'true'
            run: |
              cd vendor/ghostty
              zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native

          - name: Build zmx
            if: steps.cache-zmx.outputs.cache-hit != 'true'
            run: |
              mise run --skip-deps build-zmx

      # --- Setup resources + build + test (delegated to mise) ---

      - parallel:
          - name: Copy XCFramework
            run: |
              mise run --skip-deps copy-xcframework

          - name: Setup dev resources
            run: |
              SHELL_SRC="vendor/ghostty/zig-out/share/ghostty/shell-integration"
              SHELL_DST="Sources/AgentStudio/Resources/ghostty/shell-integration"
              if [ ! -d "$SHELL_DST" ]; then
                mkdir -p "$(dirname "$SHELL_DST")"
                cp -R "$SHELL_SRC" "$SHELL_DST"
              fi
              TERMINFO_SRC="vendor/ghostty/zig-out/share/terminfo"
              TERMINFO_DST="Sources/AgentStudio/Resources/terminfo"
              if [ ! -d "$TERMINFO_DST/78" ]; then
                mkdir -p "$TERMINFO_DST/78" "$TERMINFO_DST/67"
                [ -f "$TERMINFO_SRC/78/xterm-ghostty" ] && cp "$TERMINFO_SRC/78/xterm-ghostty" "$TERMINFO_DST/78/"
                [ -f "$TERMINFO_SRC/67/ghostty" ] && cp "$TERMINFO_SRC/67/ghostty" "$TERMINFO_DST/67/"
              fi

      - name: Prebuild Swift test bundles
        env:
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          SWIFT_TEST_PREBUILD_TIMEOUT_SECONDS: "1200"
        run: mise run --skip-deps test:swift:prebuild

      - name: Test fast lane
        env:
          SWIFT_TEST_SKIP_PREBUILD: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          _XCB_BYPASS: "1"
        run: mise run --skip-deps --raw test:swift:fast

      - name: Test large lane
        env:
          SWIFT_TEST_SKIP_PREBUILD: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          _XCB_BYPASS: "1"
        run: mise run --skip-deps --raw test:swift:large

      - name: Test WebKit lane
        env:
          # WebKit teardown can crash swiftpm-testing-helper after assertions pass;
          # this lane isolates real WebKit runtime suites, one process each. A crash
          # fails the lane and the receipt names the suite and signal; it is never retried.
          SWIFT_TEST_SKIP_PREBUILD: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          XCB_EXTRA_ARGS: "--renderer github-actions"
        run: mise run --skip-deps test:swift:webkit

      - name: Verify release-script contract
        run: mise run lint:release-scripts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results-*.xml
          if-no-files-found: warn

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-crash-reports-${{ github.run_id }}
          # A test process can die of a signal after its last flushed line, so the
          # job log shows a passing run and then nothing. Traps raised by
          # libdispatch and os_unfair_lock report through os_log rather than
          # stderr, so the .ips "Application Specific Information" field is the
          # only place their reason survives.
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore

      - name: Summarize CI timing
        if: always()
        run: /bin/bash scripts/summarize-ci-timing.sh

      - name: Upload CI timing ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.run_id }}-swift
          path: |
            tmp/plan-workflows/ci-runs/lane-*.timing.json
            tmp/plan-workflows/ci-runs/lane-*.events.jsonl
            tmp/plan-workflows/ci-runs/compiler-stats/**
            tmp/plan-workflows/ci-runs/timing-summary.md
          retention-days: 7
          if-no-files-found: warn

      - name: Upload wedged-lane event-stream ledgers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-lane-event-streams-${{ github.run_id }}
          # The runner keeps the Swift Testing event stream when a lane times out
          # or a child dies without recording a failure. It is the only
          # authoritative record of which tests started and never ended; the
          # console stream is block-buffered and stops mid-line at a wedge. A
          # timed-out lane also keeps, beside its ledger, a swift-inspect task dump
          # per stuck test process (every suspended task and where it would
          # resume) and the held-step log naming the harness steps never reached.
          path: |
            tmp/plan-workflows/ci-runs/lane-*.events.jsonl
            tmp/plan-workflows/ci-runs/lane-*.task-dump.txt
            tmp/plan-workflows/ci-runs/lane-*.held-steps.log
          if-no-files-found: ignore
