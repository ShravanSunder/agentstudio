<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Studio social card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #2e3036;
      }

      body {
        position: relative;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
      }

      .eyebrow {
        position: absolute;
        top: 66px;
        left: 72px;
        margin: 0;
        color: #9ba1ad;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand {
        position: absolute;
        top: 116px;
        left: 72px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
        font-size: 46px;
        font-weight: 750;
        letter-spacing: -0.037em;
      }

      .brand-icon {
        position: absolute;
        top: 70px;
        right: 72px;
        width: 300px;
        height: 300px;
      }

      .message {
        position: absolute;
        top: 244px;
        left: 72px;
        margin: 0;
      }

      .headline,
      .payoff {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
        font-weight: 800;
      }

      .headline {
        max-width: 720px;
        font-size: 72px;
        line-height: 0.95;
        letter-spacing: -0.054em;
      }

      .headline span {
        display: block;
      }

      .payoff {
        margin-top: 30px;
        color: #89b4fa;
        font-size: 58px;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Native macOS. Repo-aware. Terminal-first.</p>
    <p class="brand">Agent Studio</p>
    <img class="brand-icon" src="__APP_LOGO_DATA_URI__" alt="" />
    <main class="message">
      <h1 class="headline">
        <span>Run dozens of agents</span>
        <span>in one workspace.</span>
      </h1>
      <p class="payoff">Stay oriented. Miss nothing.</p>
    </main>
  </body>
</html>
