<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Studio X profile banner</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1500px;
        height: 500px;
        margin: 0;
        overflow: hidden;
        background: #2e3036;
      }

      body {
        position: relative;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
      }

      .topology {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .content {
        position: absolute;
        top: 62px;
        right: 90px;
        left: 330px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        align-items: center;
        gap: 52px;
      }

      .copy {
        min-width: 0;
      }

      .eyebrow,
      .brand,
      .headline,
      .payoff {
        margin: 0;
      }

      .eyebrow {
        color: #9ba1ad;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand,
      .headline,
      .payoff {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
        font-weight: 800;
      }

      .brand {
        margin-top: 12px;
        font-size: 34px;
        letter-spacing: -0.04em;
      }

      .headline {
        margin-top: 25px;
        font-size: 56px;
        line-height: 0.94;
        letter-spacing: -0.055em;
      }

      .headline span {
        display: block;
      }

      .payoff {
        margin-top: 20px;
        color: #89b4fa;
        font-size: 42px;
        line-height: 0.98;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      .icon {
        width: 230px;
        height: 230px;
      }
    </style>
  </head>
  <body>
    <svg class="topology" viewBox="0 0 1500 500" aria-hidden="true">
      <path d="M0 438 H1500" fill="none" stroke="#89b4fa" stroke-width="2" stroke-opacity="0.55" />
      <path
        d="M250 438 V58 Q250 28 280 28 H1370 Q1400 28 1400 58 V438"
        fill="none"
        stroke="#ef9f76"
        stroke-linecap="round"
        stroke-width="2"
        stroke-opacity="0.65"
      />
      <circle cx="250" cy="438" r="6" fill="#ef9f76" />
      <circle cx="1400" cy="438" r="6" fill="#ef9f76" />
    </svg>

    <main class="content">
      <div class="copy">
        <p class="eyebrow">Native macOS. Repo-aware. Terminal-first.</p>
        <p class="brand">Agent Studio</p>
        <h1 class="headline">
          <span>Run dozens of agents</span>
          <span>in one workspace.</span>
        </h1>
        <p class="payoff">Stay oriented. Miss nothing.</p>
      </div>
      <img class="icon" src="__APP_LOGO_DATA_URI__" alt="" />
    </main>
  </body>
</html>
