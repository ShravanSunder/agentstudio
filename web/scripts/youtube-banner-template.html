<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Studio YouTube channel banner</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 2560px;
        height: 1440px;
        margin: 0;
        overflow: hidden;
        background: #2e3036;
      }

      body {
        position: relative;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
      }

      .safe-area {
        position: absolute;
        top: 508px;
        left: 507px;
        display: grid;
        width: 1546px;
        height: 423px;
        grid-template-columns: minmax(0, 1fr) 240px;
        align-items: center;
        gap: 64px;
        padding-inline: 48px;
      }

      .copy {
        min-width: 0;
      }

      .eyebrow,
      .brand,
      .headline,
      .payoff {
        margin: 0;
      }

      .eyebrow {
        color: #9ba1ad;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand,
      .headline,
      .payoff {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
        font-weight: 800;
      }

      .brand {
        margin-top: 12px;
        font-size: 44px;
        letter-spacing: -0.04em;
      }

      .headline {
        margin-top: 18px;
        font-size: 70px;
        line-height: 0.94;
        letter-spacing: -0.055em;
      }

      .headline span {
        display: block;
      }

      .payoff {
        margin-top: 14px;
        color: #89b4fa;
        font-size: 50px;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .payoff-separator {
        display: inline-block;
        width: 0.24em;
      }

      .icon {
        width: 240px;
        height: 240px;
      }
    </style>
  </head>
  <body>
    <main class="safe-area">
      <div class="copy">
        <p class="eyebrow">Native macOS. Repo-aware. Terminal-first.</p>
        <p class="brand">Agent Studio</p>
        <h1 class="headline">
          <span>Run dozens of agents</span>
          <span>in one workspace.</span>
        </h1>
        <p class="payoff">
          <span>Stay oriented.</span><span class="payoff-separator" aria-hidden="true"></span
          ><span>Miss nothing.</span>
        </p>
      </div>
      <img class="icon" src="__APP_LOGO_DATA_URI__" alt="" />
    </main>
  </body>
</html>
